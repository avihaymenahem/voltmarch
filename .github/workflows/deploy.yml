name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/game/**'
      - 'packages/game-types/**'
      - 'packages/protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Turborepo's affected graph and future scope checks need the base
          # commit. A shallow checkout silently turns "affected" into "all".
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-pages-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pages-${{ runner.os }}-

      # Pages owns the game and its two shared dependencies. Relay, desktop and
      # marketing checks are isolated in their own jobs/workflows.
      - name: Verify game workspace
        run: npx turbo run typecheck test --filter=@voltmarch/game...

      - name: Build
        run: npx turbo run build --filter=@voltmarch/game
        env:
          # Public configuration, not a credential. The menu still probes the
          # relay before enabling Multiplayer, so an outage fails closed.
          VITE_RELAY_URL: wss://relay.voltmarch.com/ws
          # Public site identifier from Cloudflare Web Analytics. The runtime
          # rejects missing tokens and all hosts outside *.voltmarch.com.
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
