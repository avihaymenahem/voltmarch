name: Deploy multiplayer relay

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-relay
    env:
      RELAY_HOST: ${{ vars.RELAY_SSH_HOST }}
      RELAY_PORT: ${{ vars.RELAY_SSH_PORT || '22' }}
      RELAY_USER: voltmarch-deploy
      RELAY_URL: wss://relay.voltmarch.com/ws
      GAME_ORIGIN: https://play.voltmarch.com
      RELAY_PRIVATE_KEY: ${{ secrets.RELAY_SSH_PRIVATE_KEY }}
      RELAY_KNOWN_HOSTS: ${{ secrets.RELAY_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$RELAY_HOST" ]] || { echo 'Repository variable RELAY_SSH_HOST is missing'; exit 1; }
          [[ "$RELAY_PORT" =~ ^[0-9]+$ ]] || { echo 'RELAY_SSH_PORT is invalid'; exit 1; }
          [[ -n "$RELAY_PRIVATE_KEY" ]] || { echo 'RELAY_SSH_PRIVATE_KEY is missing'; exit 1; }
          [[ -n "$RELAY_KNOWN_HOSTS" ]] || { echo 'RELAY_SSH_KNOWN_HOSTS is missing'; exit 1; }

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Audit relay dependencies
        run: npm --workspace @voltmarch/relay run audit

      - name: Test relay
        run: npm run server:test

      - name: Package immutable release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(node -p "require('./package.json').version")
          protocol=$(node -p "require('./apps/relay/dist/protocol.cjs').PROTOCOL_VERSION")
          archive="/tmp/voltmarch-relay-${GITHUB_SHA}.tgz"
          staging=$(mktemp -d)
          cp -R apps/relay/dist "$staging/dist"
          cp apps/relay/deploy/smoke.mjs "$staging/smoke.mjs"
          cp apps/relay/deploy/runtime/package.json "$staging/package.json"
          cp apps/relay/deploy/runtime/package-lock.json "$staging/package-lock.json"
          tar -C "$staging" -czf "$archive" dist package.json package-lock.json smoke.mjs
          rm -rf "$staging"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$RELAY_PRIVATE_KEY" > ~/.ssh/voltmarch-relay
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/voltmarch-relay ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/voltmarch-relay -P "$RELAY_PORT" \
            "${{ steps.release.outputs.archive }}" \
            "$RELAY_USER@$RELAY_HOST:/tmp/voltmarch-relay-${GITHUB_SHA}.tgz"

      - name: Activate release with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/voltmarch-relay -p "$RELAY_PORT" "$RELAY_USER@$RELAY_HOST" \
            "sudo /usr/local/sbin/voltmarch-relay-deploy '$GITHUB_SHA' '${{ steps.release.outputs.version }}' '/tmp/voltmarch-relay-${GITHUB_SHA}.tgz'"

      - name: Verify public Cloudflare route
        run: node apps/relay/deploy/smoke.mjs "$RELAY_URL" "$GAME_ORIGIN" '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.protocol }}'

  announce:
    name: Announce verified deployment on Discord
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the complete Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version=$(node -p "require('./package.json').version")
          expected=(
            "VOLTMARCH-Setup-${version}.exe"
            "VOLTMARCH-Setup-${version}.exe.blockmap"
            "VOLTMARCH-${version}-portable.exe"
            "latest.yml"
          )
          ready=0
          for attempt in $(seq 1 80); do
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ready=1
            for asset in "${expected[@]}"; do
              if ! grep -Fxq "$asset" <<<"$assets"; then ready=0; break; fi
            done
            if [[ $ready == 1 ]]; then break; fi
            sleep 15
          done
          [[ $ready == 1 ]] || { echo "Windows release did not become complete"; exit 1; }

      - name: Resolve deployment surfaces for this commit
        id: surfaces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          targets='desktop,relay'
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            web_deployed=0
            for attempt in $(seq 1 60); do
              runs=$(gh run list --workflow deploy.yml --commit "$GITHUB_SHA" \
                --json status,conclusion --limit 10)
              if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' \
                >/dev/null <<<"$runs"; then
                web_deployed=1
                break
              fi
              if jq -e 'any(.[]; .status == "completed" and (.conclusion != "success"))' \
                >/dev/null <<<"$runs"; then
                break
              fi
              sleep 10
            done
            if [[ $web_deployed == 1 ]]; then targets+=',web'; fi
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Post exact deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VM_DEPLOYED_TARGETS: ${{ steps.surfaces.outputs.targets }}
          VM_DEPLOYED_SHA: ${{ github.sha }}
        run: node tools/post-discord-release.mjs "${{ github.ref_name }}"
