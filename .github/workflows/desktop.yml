name: Publish Windows desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          # basisu's optional cpu-features probe cannot detect MSVC in the
          # hosted PowerShell environment. Install the unified workspace
          # without lifecycle scripts, then fetch only Electron's runtime.
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm rebuild electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ('${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Verify source
        shell: pwsh
        run: |
          npx turbo run typecheck --filter=@voltmarch/desktop...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --workspace @voltmarch/desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer, portable executable and update manifest
        run: npm run desktop:dist
        env:
          VITE_RELAY_URL: wss://relay.voltmarch.com/ws
          # Optional. Empty until the owner provisions one consistent trusted
          # publisher identity; GitHub masks both values and neither is tracked.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify signing state and write checksums
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          $version = node -p "require('./package.json').version"
          $executables = @(
            "apps/desktop/release/VOLTMARCH-Setup-$version.exe",
            "apps/desktop/release/VOLTMARCH-$version-portable.exe"
          )
          foreach ($file in $executables) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release executable: $file" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($env:EXPECT_SIGNED -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Signing was configured but $file is $($signature.Status)"
            }
            Write-Host "$file Authenticode: $($signature.Status)"
          }

          $release = "apps/desktop/release"
          $files = Get-ChildItem -LiteralPath $release -File |
            Where-Object { $_.Name -match '^(VOLTMARCH-|latest\.yml)' } |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content -LiteralPath "$release/SHA256SUMS.txt" -Encoding ascii

      - name: Attest Windows release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/desktop/release/VOLTMARCH-Setup-*.exe
            apps/desktop/release/VOLTMARCH-Setup-*.exe.blockmap
            apps/desktop/release/VOLTMARCH-*-portable.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: voltmarch-windows-${{ github.ref_name }}
          path: |
            apps/desktop/release/VOLTMARCH-Setup-*.exe
            apps/desktop/release/VOLTMARCH-Setup-*.exe.blockmap
            apps/desktop/release/VOLTMARCH-*-portable.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = '${{ github.ref_name }}'
          $assets = @(
            "apps/desktop/release/VOLTMARCH-Setup-$version.exe",
            "apps/desktop/release/VOLTMARCH-Setup-$version.exe.blockmap",
            "apps/desktop/release/VOLTMARCH-$version-portable.exe",
            "apps/desktop/release/latest.yml",
            "apps/desktop/release/SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release create $tag @assets --verify-tag --generate-notes --title "VOLTMARCH $version"
