# ============================================================================
# nginx.conf — TLS termination and the first line of rate limiting
# ============================================================================
# The relay listens on 127.0.0.1:8787 and is not routable from outside. This is
# the only way in.
#
# ── INSTALL, AND THE ORDER MATTERS ──────────────────────────────────────────
#
#   1. sudo sed -i 's/relay.example.com/YOUR.HOST/g' nginx.conf   # 4 places
#   2. sudo certbot certonly --standalone -d YOUR.HOST
#   3. sudo cp nginx.conf /etc/nginx/sites-available/voltmarch-relay
#   4. sudo ln -s /etc/nginx/sites-available/voltmarch-relay /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# THE CERTIFICATE IS OBTAINED BEFORE THIS FILE IS ENABLED, and that is a fix
# rather than a preference. This used to say `certbot --nginx` at step 3, with
# the two `ssl_certificate` lines below COMMENTED OUT — and nginx refuses to
# load a `listen 443 ssl` block with no certificate at all, so `nginx -t` fails
# on the very config certbot's nginx plugin was being asked to repair. It
# cannot bootstrap itself. `certonly --standalone` needs port 80 free, which it
# is until step 4.
#
# WSS IS NOT OPTIONAL. A browser refuses a plaintext ws:// socket from an https
# page, and `src/shell/net-link.ts` refuses one to any non-loopback host on
# every target including the desktop build. That means a real certificate, which
# means a real hostname — there is no way to run this on a bare IP address.
# ============================================================================

# Connection limiting by source address. `limit_conn_zone` is cheap and it is
# the layer that survives an attacker who never completes a WebSocket
# handshake, which the application's own per-IP cap never sees.
#
# NOTE THE IPv6 CAVEAT: `$binary_remote_addr` is the full 16 bytes, so this
# counts per /128 and a single customer's /64 walks straight past it. The relay
# groups IPv6 to a /64 itself (`server/src/address.ts#limitKey`) — this zone is
# the coarse outer layer, not the one that binds.
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=relay_req:10m rate=30r/m;

# WebSocket upgrade needs Connection: upgrade when the client asks for it, and
# a normal close otherwise. Getting this wrong breaks keepalive for everything.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    # Everything goes to TLS. certbot rewrites this block; keep the redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.example.com;

    # NO `http2 on;`, DELIBERATELY. It is a 1.25.1+ directive and Ubuntu 22.04
    # (1.18), Debian 12 (1.22.1) and Ubuntu 24.04 (1.24) all reject it outright
    # as unknown — so the line that used to be here made this file fail to load
    # on most current LTS releases. It also buys nothing: a WebSocket handshake
    # is HTTP/1.1 by definition (h2 needs RFC 8441, which nginx does not
    # implement), and this host serves no documents. If you want h2 for a health
    # check on nginx >= 1.25.1, add it back — it is not needed for the relay.

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # EXPLICIT, because nginx's default is `HIGH:!aNULL:!MD5`, which still admits
    # static-RSA key exchange (no forward secrecy) and SHA1-MAC CBC suites on
    # TLS 1.2. No browser that can reach this endpoint needs either. TLS 1.3
    # suites are not configurable here and are all AEAD + PFS already.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # This host serves one WebSocket endpoint. Nothing here is a document, so
    # the headers below are about denying capability rather than shaping pages.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Do not advertise the version to a scanner.
    server_tokens off;

    # AT SERVER LEVEL, NOT INSIDE `location /ws`. They used to live in the
    # location, so `location /` — the 404 catch-all — carried no limit at all
    # and could be hammered at an unbounded request rate. Cheap for nginx to
    # answer, but it made the header's "first line of rate limiting" claim false
    # for every path except one.
    limit_req  zone=relay_req burst=10 nodelay;
    limit_conn relay_conn 8;
    # 503 is "come back later"; 429 is "you are doing too much". Only one of
    # those is true, and a monitor that alerts on 5xx should not fire on it.
    limit_req_status  429;
    limit_conn_status 429;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # EXACT MATCH. `location /ws` is a PREFIX, so `/wsanything` proxied too. The
    # relay ignores the path entirely, so that was cosmetic — but a rule that
    # does not say what it means is one somebody later reasons from.
    location = /ws {
        # NO ACCESS LOG. `server/README.md` states that addresses are hashed
        # with a per-boot salt and are "useless as a record of who played from
        # where" — and the relay honours that exactly (three log lines total,
        # none carrying an address). This file defeated it one hop up: with no
        # `access_log` directive, the distribution's http-level
        # `access_log /var/log/nginx/access.log combined` applies, whose first
        # field is `$remote_addr`, written to disk when each socket closes.
        # Turn it back on for a debugging session if you need it, and know what
        # you are turning on.
        access_log off;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The relay checks Origin itself; it can only do that if we forward it.
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        # Needed for per-address limits to mean anything behind a proxy. The
        # relay hashes this with a per-boot salt and never logs it whole.
        proxy_set_header X-Real-IP $remote_addr;

        # A lockstep match is a long-lived socket with 100 ms of traffic.
        #
        # THE DEFAULT WOULD NOT ACTUALLY DROP A PAUSED LOBBY — this comment used
        # to say it would, and that is false: the relay pings unconditionally
        # every `heartbeatMs` (15 s), so upstream data reaches nginx four times
        # inside a 60 s read timeout and it never fires. The setting is kept
        # because it removes a whole class of "why did my match end" question,
        # not because 60 s is broken. The heartbeat is what actually detects a
        # dead peer, and it does so in 30 s.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Nothing else is served from this host.
    location / {
        return 404;
    }
}

# ── ONE CORRECTION TO A CLAIM THAT USED TO BE HERE ──────────────────────────
#
# The `limit_req` comment above the location block used to read: "a script
# enumerating invite codes by reconnecting hits this long before it hits the
# application's join limit." That is backwards in both halves.
#
# `takeJoinToken` keys its bucket on the salted ADDRESS, not on the socket, so
# reconnecting does not refresh the budget — and an attacker needs no
# reconnection at all, because one socket can send many `join` messages. The
# application's 10/min therefore binds at attempt 11 while nginx has still
# allowed only 1 of its 30+10 handshakes. The app limit is the one doing the
# work; this zone is the outer floor under it.
