# ============================================================================
# nginx.conf — TLS termination and the first line of rate limiting
# ============================================================================
# The relay listens on 127.0.0.1:8787 and is not routable from outside. This is
# the only way in.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/voltmarch-relay
#   sudo ln -s /etc/nginx/sites-available/voltmarch-relay /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d relay.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# WSS IS NOT OPTIONAL. The game is served over https from GitHub Pages, and a
# browser refuses a plaintext ws:// socket from a secure page. That means a real
# certificate, which means a real hostname — there is no way to run this on a
# bare IP address.
# ============================================================================

# Connection limiting by source address. `limit_conn_zone` is cheap and it is
# the layer that survives an attacker who never completes a WebSocket
# handshake, which the application's own per-IP cap never sees.
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=relay_req:10m rate=30r/m;

# WebSocket upgrade needs Connection: upgrade when the client asks for it, and
# a normal close otherwise. Getting this wrong breaks keepalive for everything.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    # Everything goes to TLS. certbot rewrites this block; keep the redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # This host serves one WebSocket endpoint. Nothing here is a document, so
    # the headers below are about denying capability rather than shaping pages.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Do not advertise the version to a scanner.
    server_tokens off;

    location /ws {
        # New handshakes per address. A player opens ONE socket per match, so
        # 30/min is generous; a script enumerating invite codes by reconnecting
        # hits this long before it hits the application's join limit.
        limit_req  zone=relay_req burst=10 nodelay;
        limit_conn relay_conn 8;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The relay checks Origin itself; it can only do that if we forward it.
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        # Needed for per-address limits to mean anything behind a proxy. The
        # relay hashes this with a per-boot salt and never logs it whole.
        proxy_set_header X-Real-IP $remote_addr;

        # A lockstep match is a long-lived socket with 100 ms of traffic. The
        # default 60 s read timeout would drop a paused lobby; the heartbeat in
        # the relay is what actually detects a dead peer.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Nothing else is served from this host.
    location / {
        return 404;
    }
}
