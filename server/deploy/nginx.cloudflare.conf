# Installed inside nginx's http{} context by bootstrap-host.sh.
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=relay_req:10m rate=30r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_HOSTNAME__;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 currently ships nginx 1.24, which uses the listen parameter
    # rather than the newer standalone `http2 on` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __RELAY_HOSTNAME__;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location /ws {
        limit_req  zone=relay_req burst=10 nodelay;
        limit_conn relay_conn 8;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;

        # cloudflare-realip.conf rewrites $remote_addr only when the TCP peer is
        # one of Cloudflare's published ranges. A direct caller cannot forge it.
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
