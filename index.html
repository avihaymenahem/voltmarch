<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="VOLTMARCH - a real-time strategy game running in the browser." />
<title>VOLTMARCH</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/mark-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/brand/mark-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/brand/mark-180.png" />
<!-- 512 is what Android uses for add-to-home-screen. It was in public/brand/ and shipping
     in every deploy with nothing linking it; either it gets referenced or it should not be
     built. See public/brand/README.md. -->
<link rel="icon" type="image/png" sizes="512x512" href="/brand/mark-512.png" />

<!-- The two weights the boot curtain and menu use. `crossorigin` is required on
     a font preload even same-origin, or the browser fetches it a second time. -->
<link rel="preload" as="font" type="font/woff2" href="./fonts/rajdhani-400.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="./fonts/rajdhani-600.woff2" crossorigin />

<!-- The boot splash. Preloaded because it is the ONLY thing on screen while the
     2.7 MB entry chunk parses, and an image that arrives after the curtain it was
     meant to fill is worse than no image: the player sees the gradient, then a
     late flash of artwork, then the menu. `imagesrcset`/`imagesizes` are the
     responsive form and must mirror the <img> below exactly or the browser
     fetches a second copy. -->
<link rel="preload" as="image" type="image/webp" fetchpriority="high"
      href="/brand/splash-1600.webp"
      imagesrcset="/brand/splash-640.webp 640w, /brand/splash-1600.webp 1600w"
      imagesizes="100vw" />

<style>
  /* ------------------------------------------------------------------ *
   * RAJDHANI, SELF-HOSTED.
   *
   * This stack named 'Rajdhani' from the day it was written and nothing
   * ever shipped it. Rajdhani and Oswald are Google Fonts; neither is
   * installed by any OS. So every menu, HUD, tooltip and objective in
   * this game rendered in the FOURTH fallback -- Franklin Gothic Medium
   * on Windows -- and the face the UI was designed around was never once
   * on screen. Measured on the reporter's machine: Rajdhani MISSING,
   * Oswald MISSING, Arial Narrow MISSING, Franklin Gothic INSTALLED.
   *
   * Self-hosted rather than linked from fonts.googleapis.com: a CDN link
   * adds a third-party request to every page load, leaks player IPs to
   * Google, and fails offline and behind a file:// path -- which the
   * relative `base: './'` in vite.config exists to support. Rajdhani is
   * OFL-1.1, so redistribution is exactly what the licence is for. Latin
   * subset only, four weights, 60 kB total.
   *
   * `swap` and not `optional`: the shell is behind a loading curtain, so
   * a swap costs nothing visible, whereas `optional` would let a cold
   * cache silently fall back to Franklin Gothic again -- which is the bug
   * this block exists to fix.
   * ------------------------------------------------------------------ */
  @font-face {
    font-family: 'Rajdhani';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/rajdhani-400.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Rajdhani';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('./fonts/rajdhani-500.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Rajdhani';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('./fonts/rajdhani-600.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Rajdhani';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/rajdhani-700.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
</style>

<style>
  /* ------------------------------------------------------------------ *
   * Page shell. Full-bleed black, nothing scrolls, no scrollbars, no
   * text selection, no touch panning. The canvas owns the viewport.
   * ------------------------------------------------------------------ */
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #DCE4EA;
    overscroll-behavior: none;
  }

  body {
    /* Condensed industrial stack. 'Rajdhani' is self-hosted above and is
       the face this UI is designed around. Everything after it is a
       degradation path for a failed font load, NOT a peer -- the previous
       comment here claimed these were "the narrow faces that ship with
       Windows/macOS/Linux", which was false of the first two entries and
       is why the real font never rendered. */
    font-family: 'Rajdhani', 'Oswald', 'Arial Narrow', 'Franklin Gothic Medium',
                 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ------------------------------------------------------------------ *
   * Mount points. Order here is the z-order of the whole product.
   * ------------------------------------------------------------------ */
  #app  { position: fixed; inset: 0; z-index: 0; background: #000; }
  #gl   { display: block; width: 100%; height: 100%; outline: none; }

  /* Roots are click-through by default; their children opt back in. */
  #hud-root   { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #menu-root  { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #debug-root { position: fixed; inset: 0; z-index: 30; pointer-events: none; }

  /* ------------------------------------------------------------------ *
   * Loading curtain.
   * ------------------------------------------------------------------ */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background:
      radial-gradient(ellipse 120% 90% at 50% 42%, #0E1216 0%, #05070A 55%, #000 100%);
    opacity: 1;
    transition: opacity 620ms cubic-bezier(.4,0,.2,1);
    will-change: opacity;
    overflow: hidden;
  }

  /* ------------------------------------------------------------------ *
   * THE SPLASH KEY ART.
   *
   * A supplied illustration, NOT generated — one of the four exceptions
   * listed in CLAUDE.md and credited on the title screen. Derived into
   * WebP by `tools/splash.mjs`; see `public/brand/README.md`.
   *
   * It fades in on load rather than being painted immediately, and the
   * gradient underneath is what shows until then. That ordering is the
   * whole robustness story: every rule below keys off `.has-art`, which
   * the boot script only sets once the image has actually decoded. A
   * 404, a corrupt file or a byte-starved connection therefore degrades
   * to EXACTLY the curtain that shipped before this existed, including
   * the wordmark, rather than to a black rectangle with a progress bar.
   * ------------------------------------------------------------------ */
  #splash-art {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    /*
     * `cover` crops, and the crop is chosen to protect the lockup.
     *
     * MEASURED off splash-1600.webp, not estimated: the artwork's own
     * VOLTMARCH occupies x 0.310..0.687, y 0.030..0.346 of the frame.
     * Those four numbers drive this line and the media query further down,
     * and `tests/boot-splash.spec.ts` re-derives both from them.
     *
     * Vertical position only bites when the viewport is WIDER than the
     * source's 16:9 — at or below it, cover scales by height and crops
     * width instead, so this value does nothing at 16:9, 16:10 or any
     * portrait window. Above it the visible band is `S/A` of the source
     * height with its top edge at `pos x (1 - S/A)`, which must stay above
     * 0.030. That bounds `pos <= 0.126` at 21:9. 10% clears it with margin
     * and holds the lockup out to A = 2.54; beyond that — 32:9 — the wing
     * tips do clip, and chasing it would mean anchoring at 6% and throwing
     * away the foreground on every ordinary monitor to serve a rare one.
     */
    object-fit: cover;
    object-position: 50% 10%;
    opacity: 0;
    transition: opacity 760ms cubic-bezier(.4,0,.2,1);
    pointer-events: none;
  }
  #loading.has-art #splash-art { opacity: 1; }

  /* Faint diagonal mill-plate grain behind everything. */
  #loading::before {
    content: '';
    position: absolute;
    inset: -20%;
    z-index: 1;
    background:
      repeating-linear-gradient(58deg,
        rgba(255,255,255,.020) 0px,
        rgba(255,255,255,.020) 1px,
        transparent 1px,
        transparent 5px);
    pointer-events: none;
  }

  /* CRT scanlines + vignette on top. */
  #loading::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      repeating-linear-gradient(180deg,
        rgba(0,0,0,.34) 0px,
        rgba(0,0,0,.34) 1px,
        transparent 1px,
        transparent 3px),
      radial-gradient(ellipse 90% 75% at 50% 50%,
        transparent 40%, rgba(0,0,0,.72) 100%);
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  /* ------------------------------------------------------------------ *
   * The same two layers, retuned for artwork.
   *
   * The scanline pass is 34% black every third row, which is a deliberate
   * CRT read over a near-black gradient and a wrecking ball over an
   * illustration — it costs about a third of the midtones. Over art it
   * drops to 15%, and `multiply` becomes `normal` so the bottom scrim can
   * actually lay ink down instead of only darkening what is already there.
   * The scrim is what makes the progress furniture legible over surf and
   * muzzle flash; without it the status text sits on whatever the crop
   * happened to put underneath.
   * ------------------------------------------------------------------ */
  #loading.has-art {
    /* Top-scrim shape, as variables because the portrait branch far below
       needs to retune it without restating the whole three-layer stack.
       `knee` is where the alpha stops falling fast and `clear` is where it
       reaches zero; both are positions, not alphas. */
    --splash-scrim-top: .52;
    --splash-scrim-upper: .10;
    --splash-scrim-knee: 22%;
    --splash-scrim-clear: 40%;
  }
  #loading.has-art::after {
    background:
      repeating-linear-gradient(180deg,
        rgba(0,0,0,.15) 0px,
        rgba(0,0,0,.15) 1px,
        transparent 1px,
        transparent 3px),
      linear-gradient(180deg,
        rgba(2,4,6,var(--splash-scrim-top))   0%,
        rgba(2,4,6,var(--splash-scrim-upper)) var(--splash-scrim-knee),
        rgba(2,4,6,0)   var(--splash-scrim-clear),
        rgba(2,4,6,.72) 82%,
        rgba(2,4,6,.94) 100%),
      radial-gradient(ellipse 96% 82% at 50% 42%,
        transparent 45%, rgba(0,0,0,.58) 100%);
    mix-blend-mode: normal;
  }

  #loading.is-hidden { opacity: 0; pointer-events: none; }
  #loading[hidden]   { display: none; }

  .curtain-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 0 24px;
    max-width: min(1100px, 94vw);
  }

  /* With art, the furniture drops to a lower third and stops competing with
     the illustration for the centre of the frame. */
  #loading.has-art { justify-content: flex-end; }
  #loading.has-art .curtain-inner {
    gap: 20px;
    padding-bottom: clamp(26px, 6vh, 74px);
  }

  /*
   * THE ARTWORK CONTAINS THE WORDMARK, so the DOM one is a duplicate — but
   * only where the crop keeps it, and THE THRESHOLD IS DERIVED, NOT PICKED.
   *
   * This said 4:3 on the first pass, from an assumption that a portrait
   * viewport clips the lockup early. It does not, and a screenshot at
   * 569x595 showed two VOLTMARCHes stacked down the page. The real bound:
   * for a viewport aspect A below the source's 16:9, `cover` scales to fill
   * the height and shows the middle `A/S` of the source width, centred. The
   * lockup spans x 0.310..0.687 — 0.190 either side of the midline at its
   * widest — so it survives while A/(2S) >= 0.190, that is A >= 0.676, not
   * 1.33. 17/25 is 0.68: the derived bound, rounded up by 0.65%.
   *
   * THE MARGIN GOES IN THE BOX, NOT IN THIS NUMBER, and the second attempt
   * got that backwards too. Padding the threshold UPWARD to 4/5 opened a
   * band from 0.676 to 0.8 where the artwork's lockup is whole and the <h1>
   * is drawn anyway — the duplicate, back again, just narrower; a screenshot
   * at 600x800 showed it. Slack belongs in LOCKUP, which was measured by
   * cropping to those bounds and confirming a visible margin on all four
   * sides, so 0.676 is already conservative and this number should sit on it.
   *
   * Below it — a phone held upright — the crop really does cut both ends of
   * the lockup, so the <h1> IS the title and the art is scenery behind it.
   *
   * `:not([data-state])` scopes this to an ordinary boot. `__vmFail` sets
   * that attribute, and the failure states want the wordmark back: they dim
   * the art to let the panel read, and the alarm blink is attached to
   * `.title img`, so hiding it would silently delete the alarm.
   */
  @media (aspect-ratio >= 17/25) {
    #loading.has-art:not([data-state]) .title { display: none; }
  }

  /*
   * PORTRAIT: THE ARTWORK STOPS TRYING TO BE THE TITLE.
   *
   * Below the threshold the crop cuts both ends of the painted lockup, so the
   * <h1> comes back — and on its own that leaves a clipped VOLTMARCH sitting
   * directly above a clean one, which is the duplicate again wearing a worse
   * hat. It cannot be solved by moving the crop: at aspects under 16:9 cover
   * fills by HEIGHT, nothing vertical is cut, and `object-position` has no
   * axis left to work on.
   *
   * So the top scrim goes almost opaque instead. The clipped lockup sinks
   * into the dark band the <h1> then sits on, the battle scene stays visible
   * through the middle, and the frame reads as a designed portrait splash
   * rather than a landscape one that has been squeezed.
   *
   * Range syntax rather than `max-aspect-ratio: 17/25`, because min- and max-
   * are both inclusive and would BOTH match at exactly 0.68 — hiding the
   * title and burying the artwork's, for a curtain with no title at all.
   */
  @media (aspect-ratio < 17/25) {
    #loading.has-art {
      /*
       * THE KNEE HAS TO CLEAR THE LOCKUP, and the first attempt left it at
       * the landscape 22% while the painted lockup runs to y 0.346. Its
       * lower half — chevron and stars — sat under barely half the scrim and
       * still read as a cut wordmark under the real one. In portrait there
       * is no vertical crop, so those source fractions ARE viewport
       * fractions: the knee moves to 40% so the whole band is covered at
       * >= .90, then clears fast enough to leave the battle scene visible.
       */
      --splash-scrim-top: .97;
      --splash-scrim-upper: .90;
      --splash-scrim-knee: 40%;
      --splash-scrim-clear: 62%;
    }
    /* The furniture STAYS at the bottom, where the bottom scrim is. Centring
       it put the status line and the progress bar over open surf. */
  }

  /* --- Title treatment: industrial stencil, steel + volt-cyan --------- *
   * Palette tracks src/shell/shell.css (--vm-accent / --vm-text) and the
   * logo lockup in public/brand, so the curtain and the title screen are
   * the same product. VOLT reads as brushed steel, MARCH as the bolt.    */
  .title {
    margin: 0;
    line-height: 0;
  }

  /* The supplied lockup, not a CSS re-creation of it. Its cyan is already a
     near-match for --vm-accent (#35C8F0), so the halo below just extends the
     glow that is painted into the artwork rather than tinting it. */
  .title img {
    display: block;
    width: clamp(280px, 52vw, 720px);
    height: auto;
    filter: drop-shadow(0 0 42px rgba(53, 200, 240, .34));
  }

  /* --- Rules + subtitle ---------------------------------------------- */
  .rule {
    position: relative;
    width: min(620px, 82vw);
    height: 3px;
    background: linear-gradient(90deg, transparent, #14485A 12%, #35C8F0 50%, #14485A 88%, transparent);
    overflow: hidden;
  }
  .rule::after {
    content: '';
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: linear-gradient(90deg, transparent, #BDEBFA, transparent);
    animation: sweep 2.4s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes sweep { 0% { left: -32%; } 100% { left: 102%; } }

  .subtitle {
    margin: 0;
    font-size: clamp(11px, 1.25vw, 15px);
    letter-spacing: .58em;
    text-indent: .58em;
    text-transform: uppercase;
    color: #5D6B7B;
    font-weight: 600;
  }

  /* Hazard chevrons - the cheapest "industrial" signal there is. */
  .hazard {
    width: min(620px, 82vw);
    height: 9px;
    background: repeating-linear-gradient(
      -45deg,
      #1E7F99 0 10px,
      #0E1216 10px 20px);
    opacity: .55;
  }

  /* --- Progress ------------------------------------------------------- */
  .progress-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(460px, 78vw);
  }

  .progress {
    position: relative;
    width: 100%;
    height: 12px;
    background: #0B0F13;
    border: 1px solid #1E2A33;
    box-shadow: inset 0 1px 0 rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03);
    overflow: hidden;
  }
  .progress::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg,
      transparent 0 9px, rgba(0,0,0,.85) 9px 12px);
    z-index: 2;
    pointer-events: none;
  }
  .progress-bar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 34%;
    background: linear-gradient(90deg, #14485A, #35C8F0 60%, #A8E8FA);
    box-shadow: 0 0 14px rgba(53,200,240,.55);
    animation: crawl 1.65s cubic-bezier(.62,.06,.35,.96) infinite;
  }
  @keyframes crawl {
    0%   { left: -36%; }
    100% { left: 102%; }
  }

  .status {
    font-size: 12px;
    letter-spacing: .34em;
    text-indent: .34em;
    text-transform: uppercase;
    color: #5D6B7B;
    min-height: 1.2em;
    text-align: center;
  }
  .status .tick { color: #35C8F0; }

  /* --- Error surface -------------------------------------------------- */
  #boot-error {
    display: none;
    width: min(820px, 90vw);
    max-height: 46vh;
    overflow: auto;
    text-align: left;
    background: #120B0A;
    border: 1px solid #6B211A;
    border-left: 4px solid #E03A2A;
    box-shadow: 0 18px 60px rgba(0,0,0,.75);
  }
  #boot-error h2 {
    margin: 0;
    padding: 10px 16px;
    font-size: 13px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #FF9A88;
    background: #24100D;
    border-bottom: 1px solid #4A1712;
  }
  #boot-error pre {
    margin: 0;
    padding: 14px 16px;
    font-family: 'Cascadia Mono', 'Consolas', 'SFMono-Regular', ui-monospace, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: #E4C9C4;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    -webkit-user-select: text;
  }

  /* Error state: kill the progress crawl, show the panel. */
  #loading[data-state='error'] .progress-wrap { display: none; }
  #loading[data-state='error'] #boot-error    { display: block; }
  #loading[data-state='error'] .title img { animation: alarm 1.1s steps(2) infinite; }
  @keyframes alarm { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  /* A failure is the one thing on this screen that has to be readable, so the
     art stops being a backdrop and becomes a faint texture. Both states, not
     just 'error' — a 'pending' panel is a wall of module names. */
  #loading.has-art[data-state] { justify-content: center; }
  #loading.has-art[data-state] #splash-art { opacity: .18; }

  /* Pending state: foundation modules not landed yet. Informational, not scary. */
  #loading[data-state='pending'] .progress-bar { animation: none; left: 0; width: 100%;
    background: linear-gradient(90deg, #2A3550, #3A86E0 60%, #8FD2FF); box-shadow: none; }
  #loading[data-state='pending'] #boot-error { display: block; border-left-color: #3A86E0; border-color: #24405F; }
  #loading[data-state='pending'] #boot-error h2 { color: #9BD0FF; background: #0E1826; border-bottom-color: #1D3350; }

  @media (prefers-reduced-motion: reduce) {
    .rule::after, .progress-bar, .title img { animation: none; }
  }
</style>
</head>
<body>

  <!-- Render surface -->
  <div id="app">
    <canvas id="gl"></canvas>
  </div>

  <!-- DOM layers owned by parallel modules -->
  <div id="hud-root"></div>
  <div id="menu-root"></div>
  <div id="debug-root"></div>

  <!-- Loading curtain -->
  <div id="loading" role="status" aria-live="polite">
    <!-- Decorative: the <title>, the <h1> and #boot-status carry every word a
         screen reader needs, so an alt here would only repeat them. -->
    <img id="splash-art" alt="" aria-hidden="true" decoding="async" fetchpriority="high"
         src="/brand/splash-1600.webp"
         srcset="/brand/splash-640.webp 640w, /brand/splash-1600.webp 1600w"
         sizes="100vw" />
    <div class="curtain-inner">
      <h1 class="title">
        <img src="/brand/logo-720.png" alt="Voltmarch" width="720" height="333" decoding="sync" />
      </h1>
      <div class="rule"></div>
      <p class="subtitle">Tactical Combat Simulation</p>
      <div class="hazard"></div>

      <div class="progress-wrap">
        <div class="progress"><div class="progress-bar"></div></div>
        <div class="status" id="boot-status">Initialising<span class="tick">_</span></div>
      </div>

      <section id="boot-error">
        <h2 id="boot-error-title">Boot Failure</h2>
        <pre id="boot-error-body"></pre>
      </section>
    </div>
  </div>

  <script>
    /* ----------------------------------------------------------------- *
     * Pre-module shell wiring.
     *
     * Everything in here runs BEFORE the bundle loads, so it still works
     * if the bundle itself fails to parse - which is exactly when you most
     * need an error on screen instead of a black rectangle.
     * ----------------------------------------------------------------- */
    (function () {
      // An RTS lives on right-click. The browser menu must never appear.
      window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { capture: true });

      /* Kill browser-level gestures that would fight the camera rig.
       *
       * `gesturestart` is Safari-only and non-standard. It is prevented here
       * so a pinch cannot zoom the PAGE. What is NOT established, because
       * nobody on this project has a Mac, is whether preventing it also
       * suppresses the `wheel` + `ctrlKey` event Safari 15+ derives from the
       * same gesture (WebKit r277772; retested across Safari 18, Chrome 128
       * and Firefox 131 in the W3C public-webapps thread of Oct 2024). If it
       * does, pinch-to-zoom is dead in Safari and only in Safari.
       *
       * THE CAMERA DOES NOT DEPEND ON THE ANSWER. A plain two-finger scroll
       * dollies (`NavigationOptions.trackpadScroll`, default `'zoom'`), and
       * `=` / `-` zoom from the keyboard, so a Safari player has two working
       * zooms whichever way this resolves. Do not delete this line to find
       * out — it is the only thing stopping the page zoom. Comment it out
       * locally, pinch, and read the console.                                */
      window.addEventListener('dragstart', function (e) { e.preventDefault(); });
      window.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.preventDefault();           // pinch-zoom the page
      }, { passive: false });

      /**
       * Paint a failure onto the curtain. Global so main.ts can reuse the
       * exact same surface, and so an early parse error still reports.
       * state: 'error' (red, something broke) | 'pending' (blue, expected).
       */
      window.__vmFail = function (title, detail, state) {
        var curtain = document.getElementById('loading');
        if (!curtain) return;
        curtain.hidden = false;
        curtain.classList.remove('is-hidden');
        curtain.setAttribute('data-state', state || 'error');
        var t = document.getElementById('boot-error-title');
        var b = document.getElementById('boot-error-body');
        if (t) t.textContent = String(title || 'Boot Failure');
        if (b) b.textContent = String(detail == null ? '' : detail);
        var s = document.getElementById('boot-status');
        if (s) s.textContent = state === 'pending' ? 'Awaiting modules' : 'Halted';
      };

      /*
       * Arm the splash only once the artwork has really decoded.
       *
       * `.complete` is checked FIRST and it is not belt-and-braces: this
       * script runs after the <img> in document order, so on a warm cache
       * (every launch after the first, and every desktop launch, where the
       * file is on local disk behind a preload hint) the load event has
       * already fired and `addEventListener` alone would never run. That is
       * the case where the splash would be missing for the people who see it
       * most often. `naturalWidth` guards the other direction — `complete` is
       * also true for an image that failed.
       */
      (function () {
        var art = document.getElementById('splash-art');
        var curtain = document.getElementById('loading');
        if (!art || !curtain) return;
        var arm = function () {
          if (art.naturalWidth > 0) curtain.classList.add('has-art');
        };
        if (art.complete) arm();
        else art.addEventListener('load', arm, { once: true });
      })();

      window.__vmStatus = function (text) {
        var s = document.getElementById('boot-status');
        if (s) s.innerHTML = String(text).replace(/</g, '&lt;') + '<span class="tick">_</span>';
      };

      window.addEventListener('error', function (e) {
        // Ignore resource load errors from elements; only script errors matter here.
        if (e && e.message) {
          window.__vmFail('Boot Failure', (e.message || 'Unknown error') +
            (e.filename ? '\n\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        window.__vmFail('Unhandled Rejection', (r && r.stack) || String(r));
      });
    })();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
