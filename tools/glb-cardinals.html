<!doctype html>
<meta charset="utf-8">
<title>VOLTMARCH GLB cardinal audit</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17191d; }
  canvas { display: block; width: 100%; height: 100%; }
  #status { position: fixed; inset: 12px auto auto 12px; color: #fff; font: 14px monospace; }
</style>
<canvas id="view"></canvas><div id="status">Loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const params = new URLSearchParams(location.search);
  const modelUrl = params.get('model');
  const backend = params.get('backend') ?? 'webgl';
  if (!modelUrl) throw new Error('Pass ?model=/path/to/model.glb');
  if (!['webgl', 'webgpu'].includes(backend)) throw new Error('Pass ?backend=webgl|webgpu');

  const canvas = document.querySelector('#view');
  const renderer = backend === 'webgpu'
    ? new (await import('three/webgpu')).WebGPURenderer({
        canvas, antialias: true, preserveDrawingBuffer: true,
      })
    : new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  if (backend === 'webgpu') await renderer.init();
  renderer.setPixelRatio(1);
  renderer.setSize(1200, 1200, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setScissorTest(true);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x24282e);
  scene.add(new THREE.HemisphereLight(0xf4f7ff, 0x363a42, 2.3));
  const key = new THREE.DirectionalLight(0xffffff, 3.5);
  key.position.set(5, 9, 7);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xaac7ff, 1.8);
  fill.position.set(-6, 4, -5);
  scene.add(fill);

  const gltf = await new GLTFLoader().loadAsync(modelUrl);
  const model = gltf.scene;
  if (params.get('material') === 'extended-foliage') {
    const textureLoader = new THREE.TextureLoader();
    const [base, normal, mr] = await Promise.all([
      textureLoader.loadAsync('/packages/assets/game/environment/extended-foliage/material/extended-foliage-v1.base.webp'),
      textureLoader.loadAsync('/packages/assets/game/environment/extended-foliage/material/extended-foliage-v1.normal.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/extended-foliage/material/extended-foliage-v1.mr.jpg'),
    ]);
    base.colorSpace = THREE.SRGBColorSpace;
    normal.colorSpace = THREE.NoColorSpace;
    mr.colorSpace = THREE.NoColorSpace;
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: base,
      normalMap: normal,
      normalScale: new THREE.Vector2(0.58, 0.58),
      roughness: 1,
      roughnessMap: mr,
      metalness: 0,
      metalnessMap: mr,
      vertexColors: true,
      alphaTest: 0.85,
      transparent: false,
      alphaToCoverage: false,
      side: THREE.DoubleSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  } else if (params.get('material') === 'shrub') {
    const textureLoader = new THREE.TextureLoader();
    const [base, normal, mr] = await Promise.all([
      textureLoader.loadAsync('/packages/assets/game/environment/shrub/material/temperate-shrub-v1.base.webp'),
      textureLoader.loadAsync('/packages/assets/game/environment/shrub/material/temperate-shrub-v1.normal.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/shrub/material/temperate-shrub-v1.mr.jpg'),
    ]);
    base.colorSpace = THREE.SRGBColorSpace;
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: base,
      normalMap: normal,
      normalScale: new THREE.Vector2(0.55, 0.55),
      roughness: 1,
      roughnessMap: mr,
      metalness: 0,
      metalnessMap: mr,
      vertexColors: true,
      alphaTest: 0.85,
      transparent: false,
      alphaToCoverage: false,
      side: THREE.DoubleSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  } else if (params.get('material') === 'box-prop') {
    const textureLoader = new THREE.TextureLoader();
    const [base, normal, mr] = await Promise.all([
      textureLoader.loadAsync('/packages/assets/game/environment/box-prop/material/box-prop-v1.base.webp'),
      textureLoader.loadAsync('/packages/assets/game/environment/box-prop/material/box-prop-v1.normal.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/box-prop/material/box-prop-v1.mr.jpg'),
    ]);
    base.colorSpace = THREE.SRGBColorSpace;
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: base,
      normalMap: normal,
      normalScale: new THREE.Vector2(0.58, 0.58),
      roughness: 1,
      roughnessMap: mr,
      metalness: 0.82,
      metalnessMap: mr,
      vertexColors: true,
      alphaTest: 0.85,
      transparent: false,
      alphaToCoverage: false,
      side: THREE.FrontSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  } else if (params.get('material') === 'prop-surface') {
    const textureLoader = new THREE.TextureLoader();
    const [base, normal, mr] = await Promise.all([
      textureLoader.loadAsync('/packages/assets/game/environment/prop-surface/material/prop-surface-v1.base.webp'),
      textureLoader.loadAsync('/packages/assets/game/environment/prop-surface/material/prop-surface-v1.normal.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/prop-surface/material/prop-surface-v1.mr.jpg'),
    ]);
    base.colorSpace = THREE.SRGBColorSpace;
    normal.colorSpace = THREE.NoColorSpace;
    mr.colorSpace = THREE.NoColorSpace;
    for (const texture of [base, normal, mr]) {
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.anisotropy = 4;
    }
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: base,
      normalMap: normal,
      normalScale: new THREE.Vector2(0.44, 0.44),
      roughness: 1,
      roughnessMap: mr,
      metalness: 0.88,
      metalnessMap: mr,
      vertexColors: true,
      side: THREE.FrontSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  } else if (params.get('material') === 'rock') {
    const textureLoader = new THREE.TextureLoader();
    const [base, normal, mr] = await Promise.all([
      textureLoader.loadAsync('/packages/assets/game/environment/mineral/material/mineral-rock-v1.base.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/mineral/material/mineral-rock-v1.normal.jpg'),
      textureLoader.loadAsync('/packages/assets/game/environment/mineral/material/mineral-rock-v1.mr.jpg'),
    ]);
    base.colorSpace = THREE.SRGBColorSpace;
    for (const texture of [base, normal, mr]) {
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.55, 1.35);
      texture.anisotropy = 4;
    }
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: base,
      normalMap: normal,
      normalScale: new THREE.Vector2(0.68, 0.68),
      roughness: 1,
      roughnessMap: mr,
      metalness: 0,
      metalnessMap: mr,
      vertexColors: true,
      side: THREE.FrontSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  } else if (params.get('material') !== 'original') {
    const material = new THREE.MeshStandardMaterial({
      color: 0xb8bcc2,
      roughness: 0.72,
      metalness: 0.03,
      side: params.get('double') === '1' ? THREE.DoubleSide : THREE.FrontSide,
    });
    model.traverse((node) => { if (node.isMesh) node.material = material; });
  }
  const articulation = params.get('mode') === 'articulation';
  const topdown = params.get('mode') === 'top';
  let turret = null;
  if (articulation) {
    turret = model.getObjectByName(params.get('turret') ?? 'Turret');
    if (!turret?.isMesh) throw new Error('Articulation audit requires a named turret mesh');
    const pivotValues = (params.get('pivot') ?? '').split(',').map(Number);
    if (pivotValues.length !== 3 || pivotValues.some((entry) => !Number.isFinite(entry))) {
      throw new Error('Articulation audit requires ?pivot=x,y,z');
    }
    const pivot = new THREE.Vector3(...pivotValues);
    turret.geometry = turret.geometry.clone();
    turret.geometry.translate(-pivot.x, -pivot.y, -pivot.z);
    turret.position.add(pivot);
  }
  scene.add(model);
  window.__auditModel = model;

  const bounds = new THREE.Box3().setFromObject(model);
  const centre = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());
  model.position.sub(centre);
  const radius = Math.max(size.x, size.y, size.z) * 0.72;
  const target = new THREE.Vector3(0, -size.y * 0.04, 0);
  const distance = radius * 4;
  const cardinalViews = [
    ['FRONT', new THREE.Vector3(0, radius * 0.55, distance)],
    ['RIGHT', new THREE.Vector3(distance, radius * 0.55, 0)],
    ['BACK', new THREE.Vector3(0, radius * 0.55, -distance)],
    ['LEFT', new THREE.Vector3(-distance, radius * 0.55, 0)],
  ];
  const auditCamera = new THREE.Vector3(distance * 0.72, radius * 0.62, distance * 0.72);
  const views = topdown
    ? [['TOP', new THREE.Vector3(0, distance, 0)]]
    : articulation
    ? [
        ['YAW 0', auditCamera, 0],
        ['YAW 45', auditCamera, 45],
        ['YAW 90', auditCamera, 90],
        ['YAW 180', auditCamera, 180],
      ]
    : cardinalViews;

  const labelScene = document.querySelector('#status');
  labelScene.remove();
  for (let i = 0; i < views.length; i++) {
    const singleView = views.length === 1;
    const viewportSize = singleView ? 1200 : 600;
    const x = singleView ? 0 : (i % 2) * 600;
    const y = singleView ? 0 : (i < 2 ? 600 : 0);
    const camera = new THREE.OrthographicCamera(-radius, radius, radius, -radius, 0.01, distance * 3);
    camera.position.copy(views[i][1]);
    if (topdown) camera.up.set(0, 0, -1);
    camera.lookAt(target);
    if (turret !== null) turret.rotation.y = THREE.MathUtils.degToRad(views[i][2]);
    renderer.setViewport(x, y, viewportSize, viewportSize);
    renderer.setScissor(x, y, viewportSize, viewportSize);
    if (backend === 'webgpu') await renderer.renderAsync(scene, camera);
    else renderer.render(scene, camera);
  }
  if (backend === 'webgl') renderer.getContext().finish();
  await new Promise((resolve) => requestAnimationFrame(resolve));
  // Freeze the completed WebGL frame into a regular image so automated
  // screenshots can capture it even when the browser composites canvases
  // outside the page bitmap.
  if (backend === 'webgl') {
    const capture = document.createElement('img');
    capture.alt = 'GLB cardinal audit';
    capture.src = canvas.toDataURL('image/png');
    capture.style.cssText = 'position:fixed;inset:0;margin:auto;width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain;background:#24282e';
    document.body.append(capture);
  }
  const actualBackend = backend === 'webgpu'
    ? (renderer.backend?.isWebGPUBackend === true ? 'webgpu' : 'webgl2-fallback')
    : 'webgl';
  document.title = `READY ${actualBackend} ${views.map((v) => v[0]).join(' ')}`;
</script>
